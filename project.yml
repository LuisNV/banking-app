name: BankingApp

options:
  bundleIdPrefix: com.example.tingting
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: vi

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
  configs:
    Debug:
      API_BASE_URL: "http://localhost:8081/api"
      USE_MOCK_API: "NO"
    Release:
      API_BASE_URL: "http://localhost:8081/api"
      USE_MOCK_API: "NO"

packages:
  Alamofire:
    url: https://github.com/Alamofire/Alamofire
    from: 5.9.0
  Factory:
    url: https://github.com/hmlongco/Factory
    from: 2.3.0
  KeychainAccess:
    url: https://github.com/kishikawakatsumi/KeychainAccess
    from: 4.2.2
  Kingfisher:
    url: https://github.com/onevcat/Kingfisher
    from: 7.11.0

targets:
  BankingApp:
    type: application
    platform: iOS
    sources:
      - path: BankingApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.tingting.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: BankingApp/Resources/Info.plist
      properties:
        CFBundleDisplayName: TingTing
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSFaceIDUsageDescription: Dùng khuôn mặt để đăng nhập TingTing nhanh hơn.
        API_BASE_URL: $(API_BASE_URL)
        USE_MOCK_API: $(USE_MOCK_API)
    dependencies:
      - package: Alamofire
      - package: Factory
      - package: KeychainAccess
      - package: Kingfisher

  BankingAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BankingAppTests
    dependencies:
      - target: BankingApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.tingting.app.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  BankingApp:
    build:
      targets:
        BankingApp: all
        BankingAppTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [BankingAppTests]
    archive:
      config: Release
